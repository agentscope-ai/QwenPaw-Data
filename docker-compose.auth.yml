services:
  auth:
    build:
      context: .
      dockerfile: packages/qwenpaw-data-auth/Dockerfile
    ports:
      - "8088:8088"
    environment:
      - QWENPAW_DATA_AUTH_SECRET=${QWENPAW_DATA_AUTH_SECRET}
      - QWENPAW_DATA_DB_URL=sqlite:///data/control_plane.db
      - QWENPAW_DATA_ENV=${QWENPAW_DATA_ENV:-development}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
    volumes:
      - auth-data:/data
    restart: unless-stopped

  context-manager:
    build:
      context: .
      dockerfile: packages/qwenpaw-data-context/Dockerfile
    ports:
      - "8765:8765"
    environment:
      - QWENPAW_DATA_AUTH_SECRET=${QWENPAW_DATA_AUTH_SECRET}
      - QWENPAW_DATA_DB_URL=sqlite:///data/control_plane.db
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    volumes:
      - auth-data:/data
    depends_on:
      - auth
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth
      - context-manager
    restart: unless-stopped

volumes:
  auth-data:
