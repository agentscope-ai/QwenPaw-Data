server {
    listen 443 ssl;
    server_name _;
    # Publish the unified Host dist here (includes compiled CM pages and assets).
    root /opt/qwenpaw-data/packages/qwenpaw-data-console/frontend/dist;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Auth service (API only — the auth console is part of the Context frontend)
    location /auth/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Machine-to-machine only: issues an access token for any user id, gated by
    # a service secret alone. Never reachable from outside — Host calls
    # 127.0.0.1:8088 directly. The regex also covers the /auth/ prefix, which
    # strips its own prefix before proxying to the same upstream.
    location ~ ^/(auth/)?api/auth/temporary-access$ {
        deny all;
    }
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/tenants {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/workspaces {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/users {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/roles {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/access-requests {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/platform/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # CM business endpoints have their own namespace; stream/file responses stay intact.
    location /cm-api/ {
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /cm-web/ {
        proxy_pass http://127.0.0.1:8765/web/;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    # Legacy service clients retain their CM prefix; page bookmarks enter the unified SPA.
    location ^~ /context/api/ { proxy_pass http://127.0.0.1:8765/api/; proxy_buffering off; }
    location ~ ^/context/(.*)$ { return 308 /$1$is_args$args; }
    location = /context { return 308 /$is_args$args; }
    location ^~ /api/system/model-config/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /console/api/ {
        proxy_pass http://127.0.0.1:8089/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /console/assets/ {
        rewrite ^/console(/.*)$ $1 break;
        try_files $uri =404;
    }
    location /console/ {
        rewrite ^/console(/.*)$ $1 break;
        try_files $uri $uri/ /index.html;
    }
    location /mcp/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Direct links and refreshes for Console, CM, login and platform pages.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
