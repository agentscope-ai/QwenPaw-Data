services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qwenpaw_data_demo
      POSTGRES_USER: qwenpaw_data
      POSTGRES_PASSWORD: qwenpaw-data-demo
    ports:
      - "127.0.0.1:${QWENPAW_DATA_DEMO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwenpaw_data -d qwenpaw_data_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - qwenpaw-data-demo-postgres:/var/lib/postgresql/data

volumes:
  qwenpaw-data-demo-postgres:
