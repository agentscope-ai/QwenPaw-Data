[project]
name = "qwenpaw-data-workspace"
version = "0.1.0"
description = "QwenPaw-Data monorepo workspace."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "QwenPaw-Data Contributors" }]
keywords = ["data-analysis", "ai-agents", "semantic-layer", "graph-memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/agentscope-ai/QwenPaw-Data"
Documentation = "https://github.com/agentscope-ai/QwenPaw-Data#readme"
Repository = "https://github.com/agentscope-ai/QwenPaw-Data"
Issues = "https://github.com/agentscope-ai/QwenPaw-Data/issues"
Changelog = "https://github.com/agentscope-ai/QwenPaw-Data/blob/main/CHANGELOG.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/qwenpaw-data-context",
  "packages/qwenpaw-data-host-core",
  "packages/qwenpaw-data-cli",
  "packages/qwenpaw-data-skills",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "httpx>=0.28,<0.29",
  "qwenpaw-data-context>=0.1,<0.2",
  "qwenpaw-data-host-core>=0.1,<0.2",
  "qwenpaw-data-cli>=0.1,<0.2",
  "qwenpaw-data-skills>=0.1,<0.2",
]

[tool.uv.sources]
qwenpaw-data-context = { workspace = true }
qwenpaw-data-host-core = { workspace = true }
qwenpaw-data-cli = { workspace = true }
qwenpaw-data-skills = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
  "packages",
  "tests",
]
