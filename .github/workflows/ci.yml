name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Keep CI on the validated interpreter line (see docs/COMPATIBILITY.md);
      # macos-latest otherwise provisions Python 3.14.
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Compile check
        run: >
          uv run python -m compileall -q
          -x '(\.venv|node_modules|__pycache__)'
          packages scripts examples

      - name: Static correctness check
        run: >
          uvx --from ruff==0.12.12 ruff check packages scripts examples tests
          --select E9,F63,F7,F811,F82,F841

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/qwenpaw-data-context/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: packages/qwenpaw-data-context/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  windows:
    name: Native Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The runner console defaults to cp1252, which cannot encode the
      # Chinese log/output strings emitted by the lifecycle scripts.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: packages/qwenpaw-data-context/frontend/package-lock.json

      - name: Install Java for native Neo4j smoke
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize native Windows environment
        shell: pwsh
        run: |
          .\scripts\init_local.ps1
          $cliBin = Join-Path $env:LOCALAPPDATA "QwenPaw Data\bin"
          $env:Path = "$cliBin;$env:Path"
          qwenpaw-data --help
          $mcpConfig = Join-Path $HOME ".qwenpaw-data\host\workspace\.mcp"
          if (-not (Test-Path -LiteralPath $mcpConfig -PathType Leaf)) {
            throw "Initializer did not create the DataBridge MCP config: $mcpConfig"
          }
          "QWENPAW_DATA_CLI_BIN=$cliBin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile and test Python workspace
        shell: pwsh
        run: |
          uv run python -m compileall -q -x '(\.venv|node_modules|__pycache__)' packages scripts examples
          uvx --from ruff==0.12.12 ruff check packages scripts examples tests --select E9,F63,F7,F811,F82,F841
          uv run pytest -q --full-trace -p no:cacheprovider

      - name: Lint initialized frontend
        working-directory: packages/qwenpaw-data-context/frontend
        run: npm run lint

      - name: Validate native lifecycle and demo entry points
        shell: pwsh
        run: |
          Get-ChildItem scripts, examples -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              throw "PowerShell parse failed: $($_.FullName)"
            }
          }
          py -3 scripts/init_local.py --help
          py -3 scripts/start_local.py --help
          pwsh -NoProfile -File scripts/init_local.ps1 --help
          pwsh -NoProfile -File scripts/start_local.ps1 --help
          .\examples\init_demo.ps1 -SqliteOnly
          $env:Path = "$env:QWENPAW_DATA_CLI_BIN;$env:Path"
          qwenpaw-data --help

      - name: Native lifecycle smoke test
        shell: pwsh
        run: |
          # Windows runners do not provide a Linux Docker daemon. Run a real
          # Neo4j process rather than weakening the dependency-aware health check.
          $neo4jArchive = Join-Path $env:RUNNER_TEMP "neo4j-community-5.26.0-windows.zip"
          $neo4jRoot = Join-Path $env:RUNNER_TEMP "neo4j-native"
          $neo4jHome = Join-Path $neo4jRoot "neo4j-community-5.26.0"
          Invoke-WebRequest -Uri "https://dist.neo4j.org/neo4j-community-5.26.0-windows.zip" -OutFile $neo4jArchive
          $expectedHash = "ea9c98111b72310dab8ae00b7ae4d43df59a1ea82a490579b886bffb3e30de8f"
          if ((Get-FileHash -Algorithm SHA256 $neo4jArchive).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw "Neo4j archive SHA256 mismatch"
          }
          Expand-Archive -LiteralPath $neo4jArchive -DestinationPath $neo4jRoot
          $env:NEO4J_URI = "bolt://127.0.0.1:7687"
          $env:NEO4J_USER = "neo4j"
          $env:NEO4J_PASSWORD = "qwenpaw-data-test"
          & (Join-Path $neo4jHome "bin\neo4j-admin.bat") dbms set-initial-password $env:NEO4J_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "Neo4j password initialization failed" }
          $neo4jOut = Join-Path $env:RUNNER_TEMP "neo4j.stdout.log"
          $neo4jErr = Join-Path $env:RUNNER_TEMP "neo4j.stderr.log"
          $neo4jCommand = Join-Path $neo4jHome "bin\neo4j.bat"
          $neo4j = Start-Process -FilePath "pwsh" -ArgumentList @(
            "-NoProfile", "-Command", "`"& '$neo4jCommand' console`""
          ) -PassThru -RedirectStandardOutput $neo4jOut -RedirectStandardError $neo4jErr
          $stdout = Join-Path $env:RUNNER_TEMP "qwenpaw-data-start.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "qwenpaw-data-start.stderr.log"
          $server = $null
          try {
            $server = Start-Process -FilePath "pwsh" -ArgumentList @(
              "-NoProfile", "-File", (Resolve-Path "scripts/start_local.ps1"),
              "--skip-neo4j"
            ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $apiHealthy = $false
            $uiHealthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($neo4j.HasExited) {
                throw "Neo4j exited early with code $($neo4j.ExitCode)"
              }
              if ($server.HasExited) {
                throw "start_local.ps1 exited early with code $($server.ExitCode)"
              }
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                if ($response.ok -eq $true -or $response.status -eq "ok") {
                  $apiHealthy = $true
                }
              } catch {}
              try {
                $ui = Invoke-WebRequest -Uri "http://127.0.0.1:3000" -TimeoutSec 2
                $uiHealthy = $ui.StatusCode -eq 200
              } catch {}
              if ($apiHealthy -and $uiHealthy) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $apiHealthy) { throw "DataBridge health endpoint did not become ready" }
            if (-not $uiHealthy) { throw "DataBridge UI did not become ready" }

            $env:Path = "$env:QWENPAW_DATA_CLI_BIN;$env:Path"
            qwenpaw-data datasource list
          } finally {
            $serverStopped = $true
            if ($server -and -not $server.HasExited) {
              # taskkill races child processes that exit on their own while the
              # tree is being killed and then returns a non-zero exit code that
              # would fail the step. Tolerate that race and verify termination
              # of the root process instead.
              taskkill /PID $server.Id /T /F 2>&1 | Out-Null
              $global:LASTEXITCODE = 0
              $serverStopped = $server.WaitForExit(30000)
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if (-not $neo4j.HasExited) {
              taskkill /PID $neo4j.Id /T /F 2>&1 | Out-Null
              $global:LASTEXITCODE = 0
              if (-not $neo4j.WaitForExit(30000)) {
                throw "Neo4j console process (PID $($neo4j.Id)) is still running after taskkill"
              }
            }
            if (Test-Path $neo4jOut) { Get-Content $neo4jOut }
            if (Test-Path $neo4jErr) { Get-Content $neo4jErr }
            if (-not $serverStopped) {
              throw "start_local.ps1 (PID $($server.Id)) is still running after taskkill"
            }
          }

      - name: Verify initialization kept the checkout clean
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            $changes
            throw "Native initialization modified tracked files"
          }

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install locked runtime dependencies
        run: uv sync --all-packages

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: |
            packages/qwenpaw-data-console/frontend/package-lock.json
            packages/qwenpaw-data-context/frontend/package-lock.json

      - name: Build and test Console assets
        run: |
          python scripts/build_console.py
          npm run lint --prefix packages/qwenpaw-data-console/frontend
          npm test --prefix packages/qwenpaw-data-console/frontend

      - name: Build all workspace packages
        run: uv build --all-packages --out-dir dist

      - name: Install wheels into a clean environment
        run: |
          uv venv "$RUNNER_TEMP/qpd-release"
          uv pip install --python "$RUNNER_TEMP/qpd-release/bin/python" dist/*.whl
          uv pip check --python "$RUNNER_TEMP/qpd-release/bin/python"

      - name: Verify installed CLI and package imports
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ''
        run: |
          "$RUNNER_TEMP/qpd-release/bin/qwenpaw-data" --help
          "$RUNNER_TEMP/qpd-release/bin/python" -I -c \
            'import context_manager, qwenpaw_data.cli, qwenpaw_data.host.core.client, qwenpaw_data.console, qwenpaw_data_auth, qwenpaw_data.skills, qwenpaw_data.tracing'
          "$RUNNER_TEMP/qpd-release/bin/qwenpaw-data-console" --help
          "$RUNNER_TEMP/qpd-release/bin/python" -I -c \
            'from qwenpaw_data.console import create_app; create_app(host_url="http://127.0.0.1:8766", token="wheel-smoke", bridge_url="http://127.0.0.1:8765")'

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  databases:
    name: Database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qwenpaw_data
          POSTGRES_PASSWORD: qwenpaw-data-test
          POSTGRES_DB: qwenpaw_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qwenpaw_data -d qwenpaw_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: qwenpaw-data-test
          MYSQL_DATABASE: qwenpaw_data
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pqwenpaw-data-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/qwenpaw-data-test
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Exercise real database drivers
        env:
          QWENPAW_DATA_INTEGRATION_DATABASES: "1"
          QWENPAW_DATA_TEST_POSTGRES_DSN: postgresql://qwenpaw_data:qwenpaw-data-test@127.0.0.1:5432/qwenpaw_data
          QWENPAW_DATA_TEST_MYSQL_HOST: 127.0.0.1
          QWENPAW_DATA_TEST_MYSQL_PASSWORD: qwenpaw-data-test
          QWENPAW_DATA_TEST_NEO4J_URI: bolt://127.0.0.1:7687
          QWENPAW_DATA_TEST_NEO4J_PASSWORD: qwenpaw-data-test
        run: uv run pytest -q tests/integration/test_database_services.py

      - name: Context graph transactions and query authorization
        env:
          CM_BATCH_NEO4J_URI: bolt://127.0.0.1:7687
          CM_BATCH_NEO4J_PASSWORD: qwenpaw-data-test
          CM_EXPLORER_TEST_NEO4J_URI: bolt://127.0.0.1:7687
          CM_EXPLORER_TEST_NEO4J_PASSWORD: qwenpaw-data-test
        run: bash scripts/tests/run_pytest.sh packages/qwenpaw-data-context/tests/cm

      - name: Context API smoke with real dependencies
        env:
          QWENPAW_DATA_HOME: ${{ runner.temp }}/context-smoke-home
          QWENPAW_DATA_DB_URL: sqlite+aiosqlite:///${{ runner.temp }}/context-smoke.db
          QWENPAW_DATA_ENV_FILE: /dev/null
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: qwenpaw-data-test
        run: |
          # Context validates the shared schema; each owner creates its own tables.
          uv run python - <<'PY'
          import asyncio
          from qwenpaw_data_auth import AuthConfig, bootstrap_local
          from qwenpaw_data.host.core.db.engine import init_db, reset_engine
          bootstrap_local(AuthConfig.from_env())
          async def prepare():
              try:
                  await init_db()
              finally:
                  await reset_engine()
          asyncio.run(prepare())
          PY
          uv run python packages/qwenpaw-data-context/scripts/serve.py \
            --port 8799 --log-level warning &
          SERVE_PID=$!
          trap 'kill "$SERVE_PID" 2>/dev/null || true; wait "$SERVE_PID" || true' EXIT
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              echo "Context exited before becoming healthy" >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8799/api/health >/dev/null 2>&1; then
              echo "Context smoke test OK"
              exit 0
            fi
            sleep 1
          done
          echo "Context smoke test FAILED" >&2
          exit 1

  cli-demo-smoke:
    name: Deterministic CLI demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qwenpaw_data
          POSTGRES_PASSWORD: qwenpaw-data-demo
          POSTGRES_DB: qwenpaw_data_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qwenpaw-data -d qwenpaw_data_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/qwenpaw-data-demo
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p qwenpaw-data-demo 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run real datasource and agent flow
        run: >
          uv run python examples/smoke_test.py
          --postgres-dsn
          postgresql://qwenpaw_data:qwenpaw-data-demo@127.0.0.1:5432/qwenpaw_data_demo

      - name: Run real datasource and semantic CLI flow
        run: >
          uv run python examples/semantic_smoke_test.py
          --postgres-dsn
          postgresql://qwenpaw_data:qwenpaw-data-demo@127.0.0.1:5432/qwenpaw_data_demo

  docker:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Pull test image
        run: docker pull python:3.11-slim

      - name: Verify timeout and cancellation cleanup
        env:
          QWENPAW_DATA_DOCKER_E2E: "1"
        run: uv run pytest -q tests/integration/test_docker_process_cleanup.py

  audit:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        # The gitleaks CLI is MIT-licensed; the marketplace action requires a
        # paid license key for organization repositories, so run the pinned
        # binary directly with checksum verification.
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Export locked Python dependencies
        run: |
          uv export --all-packages --all-groups --format requirements.txt \
            --no-emit-workspace -q -o /tmp/requirements.txt

      - name: Audit Python dependencies
        run: >
          uvx --from pip-audit==2.10.1 pip-audit
          -r /tmp/requirements.txt --disable-pip --timeout 60

      - name: Audit standalone Context dependencies
        run: >
          uvx --from pip-audit==2.10.1 pip-audit
          -r packages/qwenpaw-data-context/requirements.lock.txt
          --disable-pip --no-deps --timeout 60

      - name: Install locked Python dependencies
        run: uv sync --all-packages --all-groups

      - name: Generate Python SBOM
        run: |
          uvx --from pip-audit==2.10.1 pip-audit \
            -r /tmp/requirements.txt --disable-pip --timeout 60 \
            --format cyclonedx-json --output python.cdx.json
          .venv/bin/python scripts/qualify_python_sbom.py \
            --from-environment python.cdx.json

      - name: Scan all Python licenses
        run: |
          uvx --from pip-licenses==5.5.0 pip-licenses \
            --python .venv/bin/python --from mixed --format json \
            --output-file python-licenses.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Audit all frontend dependencies
        working-directory: packages/qwenpaw-data-context/frontend
        run: |
          npm ci --ignore-scripts
          npm run audit:all

      - name: Generate frontend SBOM and license inventory
        working-directory: packages/qwenpaw-data-context/frontend
        run: npm run sbom

      - name: Audit Console dependencies and generate its SBOM
        working-directory: packages/qwenpaw-data-console/frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          # Chat SDK declares antd 6 peers while its design library uses antd 5.
          # Record the installed inventory; keep install and audit checks intact.
          node ../../qwenpaw-data-context/frontend/scripts/generate-sbom.mjs --legacy-peer-deps

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclonedx-sboms
          path: |
            python.cdx.json
            python-licenses.json
            packages/qwenpaw-data-context/frontend/frontend.cdx.json
            packages/qwenpaw-data-console/frontend/frontend.cdx.json
