version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/packages/qwenpaw-data-context/frontend"
    schedule:
      interval: "weekly"
    # @agentscope-ai/design requires exactly 1.2.1; upgrade these together.
    ignore:
      - dependency-name: "@rc-component/util"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
