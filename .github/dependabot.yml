version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Routine major upgrades are planned manually; security updates stay eligible.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/packages/qwenpaw-data-context/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Routine major upgrades are planned manually; security updates stay eligible.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    ignore:
      # @agentscope-ai/design requires exactly 1.2.1; upgrade these together.
      - dependency-name: "@rc-component/util"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Routine major upgrades are planned manually; security updates stay eligible.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
