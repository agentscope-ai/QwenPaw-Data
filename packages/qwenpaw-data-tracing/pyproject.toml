[project]
name = "qwenpaw-data-tracing"
version = "0.4.0"
description = "Shared OpenTelemetry-on-Langfuse tracing for QwenPaw-Data."
readme = { text = "OpenTelemetry tracing, context propagation, and optional Langfuse export for QwenPaw-Data. Export is disabled unless explicitly configured.", content-type = "text/plain" }
license = "Apache-2.0"
authors = [{ name = "QwenPaw-Data Contributors" }]
keywords = ["data-analysis", "ai-agents", "tracing", "opentelemetry", "langfuse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
# Upper bound <2: the span processors touch SDK internals (_events/_status/
# _attributes) that semver does not guarantee across minor versions either,
# so upgrades must stay a conscious, test-covered step.
dependencies = [
  "opentelemetry-api>=1.45.2,<2",
  "opentelemetry-sdk>=1.27.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
  "httpx>=0.28,<0.29",
  "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/agentscope-ai/QwenPaw-Data"
Documentation = "https://github.com/agentscope-ai/QwenPaw-Data/tree/main/packages/qwenpaw-data-tracing"
Repository = "https://github.com/agentscope-ai/QwenPaw-Data"
Issues = "https://github.com/agentscope-ai/QwenPaw-Data/issues"
Changelog = "https://github.com/agentscope-ai/QwenPaw-Data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenpaw_data"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "qwenpaw_data/tracing/LICENSE"
"../../NOTICE" = "qwenpaw_data/tracing/NOTICE"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
