[project]
name = "qwenpaw-data-host-core"
version = "0.4.0"
description = "Shared host foundation for QwenPaw-Data."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "QwenPaw-Data Contributors" }]
keywords = ["data-analysis", "ai-agents", "orchestration", "sandbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
  "agentscope>=2.0.8,<2.1",
  "aiodocker>=0.27,<0.28",
  "qwenpaw-data-skills>=0.4,<0.5",
  "qwenpaw-data-auth>=0.4,<0.5",
  "qwenpaw-data-context>=0.4,<0.5",
  "qwenpaw-data-tracing>=0.4,<0.5",
  "alembic>=1.14,<2.0",
  "aiosqlite>=0.20,<1.0",
  "apscheduler>=3.10,<4.0",
  "asyncpg>=0.29,<1.0",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<0.29",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "pyyaml>=6.0,<7.0",
  "shortuuid>=1.0,<2.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "tenacity>=8.0,<10.0",
]

[project.optional-dependencies]
# The service stack is part of the base install; the extra stays for existing install commands.
service = [
  "uvicorn>=0.32,<1.0",
]
channels = [
  "dingtalk-stream>=0.24.3,<0.25",
  "lark-oapi>=1.5.3,<2.0",
  "pycryptodome>=3.20,<4.0",
  "segno>=1.6,<2.0",
  "wecom-aibot-python-sdk>=1.0.2,<2.0",
]
cloud = [
  "agentscope-runtime==1.1.3",
  "alibabacloud-oss-v2>=1.2,<2.0",
  "e2b==2.31.0",
]

[project.urls]
Homepage = "https://github.com/agentscope-ai/QwenPaw-Data"
Documentation = "https://github.com/agentscope-ai/QwenPaw-Data/tree/main/packages/qwenpaw-data-host-core"
Repository = "https://github.com/agentscope-ai/QwenPaw-Data"
Issues = "https://github.com/agentscope-ai/QwenPaw-Data/issues"
Changelog = "https://github.com/agentscope-ai/QwenPaw-Data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenpaw_data"]
artifacts = [
  "src/qwenpaw_data/host/core/prompts/*.md",
  "src/qwenpaw_data/host/core/algo/evaluation/prompts/*.md",
  "src/qwenpaw_data/host/core/algo/followup/prompts/*.md",
  "src/qwenpaw_data/host/core/algo/skill_create/references/*.md",
  "src/qwenpaw_data/host/core/algo/skill_evolution/prompts/*.md",
  "src/qwenpaw_data/host/core/data/builtin_mcp.json",
]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "qwenpaw_data/host/core/LICENSE"
"../../NOTICE" = "qwenpaw_data/host/core/NOTICE"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.uv.sources]
qwenpaw-data-skills = { workspace = true }
qwenpaw-data-auth = { workspace = true }
qwenpaw-data-context = { workspace = true }
qwenpaw-data-tracing = { workspace = true }
