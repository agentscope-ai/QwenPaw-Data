[project]
name = "qwenpaw-data-auth"
version = "0.4.0"
description = "QwenPaw-Data authentication, local identity, RBAC and control plane"
readme = { text = "Public password authentication, tenant/workspace RBAC, tokens and secure local bootstrap for QwenPaw-Data.", content-type = "text/plain" }
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "QwenPaw-Data Contributors" }]
keywords = ["authentication", "rbac", "data-analysis", "local-identity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "bcrypt>=4,<6",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2,<3",
  "cryptography>=42,<51",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
hologres = ["psycopg[binary]>=3.1,<4"]

[project.urls]
Homepage = "https://github.com/agentscope-ai/QwenPaw-Data"
Documentation = "https://github.com/agentscope-ai/QwenPaw-Data/tree/main/packages/qwenpaw-data-auth"
Repository = "https://github.com/agentscope-ai/QwenPaw-Data"
Issues = "https://github.com/agentscope-ai/QwenPaw-Data/issues"
Changelog = "https://github.com/agentscope-ai/QwenPaw-Data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenpaw_data_auth"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "qwenpaw_data_auth/LICENSE"
"../../NOTICE" = "qwenpaw_data_auth/NOTICE"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
