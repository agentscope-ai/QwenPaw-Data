[project]
name = "datapaw-context"
version = "0.1.2"
description = "Context management and graph memory foundation for DataPaw."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "QwenPaw-Data Contributors" }]
keywords = ["data-analysis", "semantic-layer", "graph-memory", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
  # --- Web / 服务 ---
  "fastapi>=0.141.1,<1.0",
  "anyio>=4.13,<5.0",
  "uvicorn[standard]>=0.52.1,<1.0",
  "httpx>=0.28,<0.29",
  "aiohttp>=3.14.3,<4.0",
  "python-multipart>=0.0.32,<1.0",
  "sse-starlette>=3.4,<4.0",
  "mcp>=1.28.1,<2.0",
  # --- 配置 / 存储 ---
  "python-dotenv>=1.2.2,<2.0",
  "pydantic-settings>=2.14,<3.0",
  "pyyaml>=6.0,<7.0",
  "aiosqlite>=0.22,<1.0",
  "neo4j>=5.28,<6.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "duckdb>=1.5,<2.0",
  # --- LLM / 检索 ---
  "openai>=2.53.0,<3.0",
  "jsonschema>=4.26,<5.0",
  # --- SQL / 元数据 ---
  "sqlglot>=30.0,<31.0",
  "openpyxl>=3.1.5,<4.0",
  "pymysql>=1.1,<2.0",
  "jaydebeapi>=1.2,<2.0",
  "pyodps>=0.13,<1.0",
  "dbt-core>=1.11,<2.0",
  "dbt-duckdb>=1.10,<2.0",
  # --- 文档解析 ---
  "python-docx>=1.2,<2.0",
  "pypdf>=6.15,<7.0",
  # --- 工具 ---
  "tqdm>=4.68,<5.0",
  "requests>=2.34.2,<3.0",
  "certifi>=2023.0,<2027.0",
  "func-timeout>=4.3,<5.0",
  "oss2>=2.19,<3.0",
]

[project.urls]
Homepage = "https://github.com/agentscope-ai/QwenPaw-Data"
Documentation = "https://github.com/agentscope-ai/QwenPaw-Data/tree/main/packages/datapaw-context"
Repository = "https://github.com/agentscope-ai/QwenPaw-Data"
Issues = "https://github.com/agentscope-ai/QwenPaw-Data/issues"
Changelog = "https://github.com/agentscope-ai/QwenPaw-Data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/datapaw/context",
  "src/context_manager",
  "src/semantic_config",
]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
