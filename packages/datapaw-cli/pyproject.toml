[project]
name = "datapaw-cli"
version = "0.1.2"
description = "Standalone command-line interface for DataPaw."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "QwenPaw-Data Contributors" }]
keywords = ["data-analysis", "ai-agents", "cli", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
  "datapaw-host-core>=0.1,<0.2",
  "python-dotenv>=1.2.2,<2.0",
]

[project.scripts]
datapaw = "datapaw.cli:main"

[project.urls]
Homepage = "https://github.com/agentscope-ai/QwenPaw-Data"
Documentation = "https://github.com/agentscope-ai/QwenPaw-Data/tree/main/packages/datapaw-cli"
Repository = "https://github.com/agentscope-ai/QwenPaw-Data"
Issues = "https://github.com/agentscope-ai/QwenPaw-Data/issues"
Changelog = "https://github.com/agentscope-ai/QwenPaw-Data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapaw"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.uv.sources]
datapaw-host-core = { workspace = true }
