[project]
name = "qwenpaw-data-skills"
version = "0.4.0"
description = "Reusable data analysis skills for QwenPaw-Data."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "QwenPaw-Data Contributors" }]
keywords = ["data-analysis", "ai-agents", "skills", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
analysis = ["pandas>=2", "numpy>=1.26", "scikit-learn>=1.4", "scipy>=1.12", "ruptures>=1.1", "chinese-calendar>=1.9"]
reports = ["python-docx>=1.1"]

[project.urls]
Homepage = "https://github.com/agentscope-ai/QwenPaw-Data"
Documentation = "https://github.com/agentscope-ai/QwenPaw-Data/tree/main/packages/qwenpaw-data-skills"
Repository = "https://github.com/agentscope-ai/QwenPaw-Data"
Issues = "https://github.com/agentscope-ai/QwenPaw-Data/issues"
Changelog = "https://github.com/agentscope-ai/QwenPaw-Data/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenpaw_data"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
# Assets retain the metadata path used by existing Apps; qwenpaw_data.skills
# is the public accessor. One canonical bundle avoids duplicate wheel payloads.
"skills" = "qwenpaw_data_skills/skills"
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
